<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="t d">
<title id="t">AXNOVATECH animated digital core</title><desc id="d">A layered blue-violet glass orb with orbiting rings and subtle animated light.</desc>
<defs>
 <radialGradient id="core" cx="32%" cy="24%" r="78%"><stop stop-color="#D7E8FF"/><stop offset=".18" stop-color="#77B0FF"/><stop offset=".52" stop-color="#386FEA"/><stop offset="1" stop-color="#111C49"/></radialGradient>
 <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#D8E9FF" stop-opacity=".85"/><stop offset=".45" stop-color="#6FA7FF" stop-opacity=".12"/><stop offset="1" stop-color="#9A8CFF" stop-opacity=".8"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<circle cx="360" cy="360" r="230" fill="#326FEF" opacity=".22" filter="url(#blur)"/>
<g transform="translate(360 360)">
 <ellipse rx="270" ry="112" fill="none" stroke="url(#ring)" stroke-width="2" transform="rotate(-28)"><animateTransform attributeName="transform" type="rotate" from="-28" to="332" dur="32s" repeatCount="indefinite"/></ellipse>
 <ellipse rx="240" ry="150" fill="none" stroke="#8FB9FF" stroke-opacity=".38" stroke-width="1.5" transform="rotate(58)"><animateTransform attributeName="transform" type="rotate" from="58" to="-302" dur="42s" repeatCount="indefinite"/></ellipse>
 <circle r="178" fill="url(#core)" stroke="#C9E0FF" stroke-opacity=".6" stroke-width="2"/>
 <circle r="150" fill="none" stroke="#EAF3FF" stroke-opacity=".25" stroke-width="1"/>
 <path d="M-120 -95Q-20 -180 90 -112T150 25Q45 -35 -45 42T-120 -95Z" fill="#EAF4FF" opacity=".16"/>
 <ellipse cx="-45" cy="-105" rx="76" ry="25" fill="#fff" opacity=".2" filter="url(#blur)"/>
 <circle cx="0" cy="0" r="196" fill="none" stroke="#8DB7FF" stroke-opacity=".22" stroke-width="1" stroke-dasharray="4 13"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="55s" repeatCount="indefinite"/></circle>
 <circle cx="220" cy="-92" r="8" fill="#D8E9FF" filter="url(#glow)"><animateMotion dur="12s" repeatCount="indefinite" path="M0 0A238 125 -25 1 1 -1 0"/></circle>
</g></svg>